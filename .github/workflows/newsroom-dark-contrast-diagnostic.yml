name: Newsroom Image Block Dark Contrast Regression
on:
  push:
    branches: [fix/dark-mode-editor-four-contrast-issues]
  pull_request:
    paths:
      - 'styles/newsroom-theme-components.css'
      - 'tests/image-block-dark-contrast.cjs'
      - '.github/workflows/newsroom-dark-contrast-diagnostic.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newsroom-image-contrast-server.log 2>&1 &
          sleep 2
          node tests/image-block-dark-contrast.cjs
