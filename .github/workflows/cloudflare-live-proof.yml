name: Newsroom Cloudflare Post-Merge Foundation Proof
on:
  push:
    branches: [qa/cloudflare-foundation-live-proof]
    paths:
      - '.github/workflows/cloudflare-live-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe live deployment against current main
        run: |
          set +e
          python3 scripts/verify-live-deployment.py --strict --attempts 10 --delay 20 > /tmp/foundation-live-proof.log 2>&1
          result=$?
          cat /tmp/foundation-live-proof.log
          echo "$result" >/tmp/foundation-live-proof-status.txt
          exit 0
      - name: Browser verify live Dark Mode
        run: |
          set +e
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          NR_BASE_URL=https://newsroom.avi-yansah.workers.dev/ node tests/live-dark-mode-audit.cjs > /tmp/foundation-dark-live.log 2>&1
          result=$?
          cat /tmp/foundation-dark-live.log | tail -30
          echo "$result" >/tmp/foundation-dark-live-status.txt
          exit 0
      - name: Save independent QA result
        if: always()
        run: |
          mkdir -p docs/qa/foundation-live-proof
          cp /tmp/foundation-live-proof.log docs/qa/foundation-live-proof/verify.log || true
          cp /tmp/foundation-dark-live.log docs/qa/foundation-live-proof/dark.log || true
          cp /tmp/foundation-live-proof-status.txt docs/qa/foundation-live-proof/verify-status.txt || true
          cp /tmp/foundation-dark-live-status.txt docs/qa/foundation-live-proof/dark-status.txt || true
          git config user.name "newsroom-qa-bot"
          git config user.email "newsroom-qa-bot@users.noreply.github.com"
          git add docs/qa/foundation-live-proof/
          if ! git diff --cached --quiet; then
            git commit -m "test(report): Cloudflare foundation CSS post-merge"
            git push origin HEAD:qa/cloudflare-foundation-live-proof
          fi
      - name: Acceptance
        if: always()
        run: |
          [ -f /tmp/foundation-live-proof-status.txt ] || exit 1
          [ "$(cat /tmp/foundation-live-proof-status.txt)" = "0" ] || exit 1
          [ -f /tmp/foundation-dark-live-status.txt ] || exit 1
          [ "$(cat /tmp/foundation-dark-live-status.txt)" = "0" ] || exit 1
          echo "PASS: static assets and Dark Mode load on live Cloudflare" >> "$GITHUB_STEP_SUMMARY"
