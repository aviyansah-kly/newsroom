name: Apply tags classification positioning
on:
  push:
    paths:
      - '.github/workflows/apply-tags-classification-position.yml'
      - 'scripts/patch_tags_next_to_category.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tags classification positioning
        run: python3 scripts/patch_tags_next_to_category.py
      - name: Verify tags classification positioning
        run: |
          grep -q 'NEWSROOM_TAGS_CLASSIFICATION_POSITION_START' index.html
          grep -q "locationField.insertAdjacentElement('afterend',section)" index.html
          grep -q "section.className='alt-editorial-tags-section'" index.html
          grep -q "const infoPane=\$('#infoPane')" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Keep Tags below Location in Editorial'
          git push
