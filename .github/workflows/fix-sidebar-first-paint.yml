name: Fix Newsroom sidebar first paint
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-sidebar-first-paint.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent sidebar layout flash before initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'NEWSROOM_SIDEBAR_PREPAINT_START' not in s:
              prepaint='''\n<script>\n/* NEWSROOM_SIDEBAR_PREPAINT_START */\n(function(){\n  var root=document.documentElement;\n  root.classList.add('newsroom-sidebar-prepaint');\n  try{\n    if(localStorage.getItem('sixdesk:sidebar-collapsed')==='1'){\n      root.classList.add('newsroom-sidebar-collapsed-prepaint');\n    }\n  }catch(e){}\n  window.addEventListener('DOMContentLoaded',function(){\n    requestAnimationFrame(function(){\n      requestAnimationFrame(function(){\n        root.classList.remove('newsroom-sidebar-prepaint');\n      });\n    });\n  },{once:true});\n})();\n/* NEWSROOM_SIDEBAR_PREPAINT_END */\n</script>\n'''
              needle='<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">'
              if needle not in s:
                  raise SystemExit('head insertion point not found')
              s=s.replace(needle,prepaint+needle,1)
          if 'NEWSROOM_SIDEBAR_PREPAINT_CSS_START' not in s:
              css='''\n/* NEWSROOM_SIDEBAR_PREPAINT_CSS_START */\nhtml.newsroom-sidebar-prepaint body.alt-editor-layout .cms-nav-drawer{visibility:hidden!important}\nhtml.newsroom-sidebar-prepaint body.alt-editor-layout .workspace{transition:none!important}\nhtml.newsroom-sidebar-collapsed-prepaint body.alt-editor-layout .workspace{padding-left:88px!important}\nhtml.newsroom-sidebar-collapsed-prepaint body.alt-editor-layout .cms-nav-drawer{width:64px!important}\n/* NEWSROOM_SIDEBAR_PREPAINT_CSS_END */\n'''
              needle='</style></head>'
              if needle not in s:
                  raise SystemExit('style closing marker not found')
              s=s.replace(needle,css+needle,1)
          p.write_text(s)
          PY
          grep -q 'NEWSROOM_SIDEBAR_PREPAINT_START' index.html
          grep -q 'NEWSROOM_SIDEBAR_PREPAINT_CSS_START' index.html
      - name: Commit first-paint fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Prevent Newsroom sidebar first-paint layout flash'
          git push
