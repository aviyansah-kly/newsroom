name: Editor Recipe Schema Summary FAQ QA
on:
  push:
    branches:
      - feature/editor-recipe-summary-faq
    paths:
      - index.html
      - scripts/newsroom-editor-enrichment.js
      - styles/newsroom-editor-enrichment.css
      - tests/editor-enrichment-smoke.cjs
      - .github/workflows/editor-enrichment-smoke.yml
  pull_request:
    paths:
      - index.html
      - scripts/newsroom-editor-enrichment.js
      - styles/newsroom-editor-enrichment.css
      - tests/editor-enrichment-smoke.cjs
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Editor enrichment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newsroom-enrichment.log 2>&1 &
          sleep 2
          node tests/editor-enrichment-smoke.cjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-editor-enrichment-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
