name: Inspect actual Editor Dark Mode ink and tabs
on:
  push:
    branches: [fix/dark-mode-consistency-20261014]
    paths:
      - tests/dark-mode-editor-ink-audit.cjs
      - .github/workflows/dark-mode-editor-ink-audit.yml
      - styles/newsroom-theme-components.css
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Inventory real Editor computed styles
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newsroom-audit-server.log 2>&1 &
          sleep 2
          node tests/dark-mode-editor-ink-audit.cjs
