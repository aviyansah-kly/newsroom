name: Diagnose live Editor dark-mode borders and text
on:
  push:
    branches: [fix/dark-mode-contrast-v23-20261014]
    paths: [.github/workflows/inspect-dark-editor-v23.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Inspect rendered editor
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nr-v23.log 2>&1 &
          sleep 2
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
          const b=await chromium.launch({headless:true,args:['--no-sandbox']});
          const p=await b.newPage({viewport:{width:1440,height:950}});
          await p.addInitScript(()=>localStorage.setItem('newsroom:appearance','dark'));
          await p.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:45000});
          await p.locator('#publishBtn').waitFor();
          await p.waitForTimeout(1500);
          const report=await p.evaluate(()=>{
          const identify=e=>e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+(typeof e.className==='string'?'.'+e.className.trim().split(/\s+/).slice(0,3).join('.'):''), colors=e=>{const s=getComputedStyle(e);return {bg:s.backgroundColor,fg:s.color,bt:s.borderTopColor,bb:s.borderBottomColor,bl:s.borderLeftColor,br:s.borderRightColor,width:s.borderTopWidth,shadow:s.boxShadow,css:e.getAttribute('style')?.slice(0,80)}},visible=e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>4&&r.height>4&&s.display!=='none'&&s.visibility!=='hidden'};
          const groups=[
            ['CENTER_SECTIONS','.alt-writing-card,.alt-editor-section,.alt-editor-section-head,.alt-writing-card .headline,.alt-writing-card .section-head,.alt-writing-card .alt-editor-section,.alt-writing-card .alt-content-card,.alt-writing-card .alt-content-card-head,.alt-writing-card .alt-content-card-foot'],
            ['BLOCK_HEADING','.alt-content-card-title,.alt-content-card-title span,.alt-content-card-head strong,.alt-content-card-head span,.alt-content-card-head small,.alt-content-card-head button,.alt-content-card-sub,.alt-editor-section-head strong,.alt-editor-section-head span'],
            ['IMAGE_EMPTY','.alt-content-card[data-type=image] .alt-content-card-body,.alt-content-card[data-type=image] .alt-media-drop,.alt-content-card[data-type=image] .alt-media-drop strong,.alt-content-card[data-type=image] .alt-media-drop span,.alt-content-card[data-type=image] button,.alt-content-card .alt-preview-empty-state'],
            ['TOOLBAR','.alt-content-card[data-type=text] .classic-toolbar,.alt-content-card[data-type=text] .classic-toolbar button,.alt-content-card[data-type=text] .classic-toolbar svg,.alt-content-card .alt-mini-toolbar,.alt-editor-section .alt-add-menu'],
            ['RIGHT','.context .tabs.article-tabs-promoted,.context .tabs.article-tabs-promoted button,.context .tabs.article-tabs-promoted button .alt-tab-label,#seoPane .seo-section,.context #seoPane label,.context #seoPane .seo-section-badge,#seoPane :is(h3,h4,strong)'],
            ['DIVIDERS','.alt-writing-card,.alt-editor-section,.alt-editor-section-head,.alt-editor-section .alt-content-card,.alt-content-card-head,.alt-content-card-foot,.alt-page-line,.alt-mini-toolbar,.classic-toolbar,.alt-editor-section .alt-add-menu']
          ];
          return Object.fromEntries(groups.map(([name,selector])=>[name,[...document.querySelectorAll(selector)].filter(visible).slice(0,70).map(e=>({selector:identify(e),parent:identify(e.parentElement||e),text:(e.innerText||'').trim().slice(0,50),...colors(e)}))]));
          });for(const [k,v] of Object.entries(report))console.log('AUDIT_GROUP '+k+' '+JSON.stringify(v));
          await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)})
          JS
