name: Text toolbar baseline guard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check_text_toolbar_baseline.py
      - .github/workflows/text-toolbar-baseline-guard.yml
  pull_request:
    paths:
      - index.html
      - scripts/check_text_toolbar_baseline.py
      - .github/workflows/text-toolbar-baseline-guard.yml

jobs:
  protect-approved-text-toolbar:
    name: Approved Text toolbar unchanged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch approved Text toolbar baseline
        run: git fetch origin baseline/text-toolbar-approved-2026-09-23:refs/remotes/origin/baseline/text-toolbar-approved-2026-09-23
      - name: Check approved sticky and toolbar design
        run: python3 scripts/check_text_toolbar_baseline.py
