name: Inspect dynamic editor markup (read only)
on:
  push:
    branches: [fix/dark-mode-consistency-20261014]
    paths: [.github/workflows/inspect-editor-block-markup.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original editor DOM templates and controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for term in ['classic-toolbar','alt-mini-toolbar','alt-content-card-head','alt-content-card-body','alt-card-field','alt-add-content','alt-add-menu','alt-inline-media-preview','Add Text','Tambah Content','alt-editor-add','alt-content-grid','data-type="text"','alt-content-picker','toolbar','Tulis artikel']:
            positions=[i for i in range(len(s)) if s.startswith(term,i)]
            print('TERM',term,'COUNT',len(positions))
            for i in positions[:3]:print('EXCERPT',repr(s[max(0,i-260):i+400]))
          PY
