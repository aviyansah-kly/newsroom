name: Apply image placeholder layout patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_image_placeholder_layout.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply layout patch
        run: python scripts/patch_image_placeholder_layout.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine image placeholder layout"
          git push
