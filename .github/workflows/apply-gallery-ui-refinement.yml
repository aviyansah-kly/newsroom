name: Apply gallery UI refinement

on:
  push:
    paths:
      - 'scripts/patch_gallery_ui_refinement.py'
      - '.github/workflows/apply-gallery-ui-refinement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gallery UI refinement
        run: python scripts/patch_gallery_ui_refinement.py
      - name: Verify
        run: |
          grep -q 'NEWSROOM_GALLERY_UI_REFINEMENT_START' index.html
          grep -q "Preview & Detail" index.html
          grep -q 'newsroomGalleryOrientationFilter' index.html
          grep -q 'modal-head>button:has' index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine image gallery controls and popup close buttons"
          git push
