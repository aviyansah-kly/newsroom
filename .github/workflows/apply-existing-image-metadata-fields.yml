name: Apply existing image metadata fields
on:
  push:
    paths:
      - '.github/workflows/apply-existing-image-metadata-fields.yml'
      - 'scripts/patch_existing_image_metadata_fields.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply existing CMS image fields
        run: python3 scripts/patch_existing_image_metadata_fields.py
      - name: Verify existing CMS image fields
        run: |
          grep -q 'NEWSROOM_EXISTING_IMAGE_METADATA_FIELDS_START' index.html
          grep -q 'newsroomUnifiedPhotographer' index.html
          grep -q 'newsroomUnifiedSiteOnly' index.html
          grep -q 'newsroomUnifiedSpecialInstructions' index.html
          grep -q 'newsroomUnifiedWatermark' index.html
          grep -q 'newsroomUnifiedShortDesc' index.html
          grep -q 'Ganti File' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Align unified image metadata with existing CMS'
          git push
