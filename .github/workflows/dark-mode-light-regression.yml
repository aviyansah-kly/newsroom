name: Newsroom Light Mode Visual Regression
on:
  pull_request:
    paths:
      - 'styles/newsroom-dark-mode.css'
      - 'styles/newsroom-dark-mode-editor.css'
      - 'scripts/newsroom-shell.js'
      - 'scripts/newsroom-appearance.js'
      - 'tests/dark-mode-light-baseline.cjs'
      - '.github/workflows/dark-mode-light-regression.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
      - run: npx playwright install --with-deps chromium
      - name: Create approved Main baseline checkout
        run: |
          git fetch origin main
          git worktree add --detach /tmp/newsroom-baseline origin/main
      - name: Compare UI across both origins
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newsroom-candidate-http.log 2>&1 &
          (cd /tmp/newsroom-baseline && python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/newsroom-baseline-http.log 2>&1) &
          sleep 3
          node tests/dark-mode-light-baseline.cjs
