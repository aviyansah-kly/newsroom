name: Fix Newsroom static layout first paint
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/static-layout-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make final Newsroom layout active before first paint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove previous temporary prepaint workaround.
          s=re.sub(r'\n?<script>\s*/\* NEWSROOM_SIDEBAR_PREPAINT_START \*/.*?/\* NEWSROOM_SIDEBAR_PREPAINT_END \*/\s*</script>\s*', '\n', s, count=1, flags=re.S)
          s=re.sub(r'\n?/\* NEWSROOM_SIDEBAR_PREPAINT_CSS_START \*/.*?/\* NEWSROOM_SIDEBAR_PREPAINT_CSS_END \*/\s*', '\n', s, count=1, flags=re.S)
          # Final layout class must exist in markup, not be added after paint by JS.
          if '<body class="alt-editor-layout">' not in s:
              if '<body>' not in s:
                  raise SystemExit('plain body tag not found')
              s=s.replace('<body>', '<body class="alt-editor-layout">', 1)
          # Disable transitions during initial document construction only.
          if 'NEWSROOM_FIRST_PAINT_STABLE_START' not in s:
              css='''\n/* NEWSROOM_FIRST_PAINT_STABLE_START */\nbody.alt-editor-layout .cms-nav-drawer,\nbody.alt-editor-layout .workspace{transition:none!important}\nbody.alt-editor-layout.newsroom-layout-ready .cms-nav-drawer,\nbody.alt-editor-layout.newsroom-layout-ready .workspace{transition:width .16s ease,padding-left .16s ease,transform .16s ease!important}\n/* NEWSROOM_FIRST_PAINT_STABLE_END */\n'''
              s=s.replace('</style></head>', css+'</style></head>', 1)
          if 'NEWSROOM_LAYOUT_READY_START' not in s:
              ready='''\n<script>\n/* NEWSROOM_LAYOUT_READY_START */\nrequestAnimationFrame(function(){document.body.classList.add('newsroom-layout-ready')});\n/* NEWSROOM_LAYOUT_READY_END */\n</script>\n'''
              s=s.replace('</body>', ready+'</body>', 1)
          p.write_text(s)
          PY
          grep -q '<body class="alt-editor-layout">' index.html
          ! grep -q 'NEWSROOM_SIDEBAR_PREPAINT_START' index.html
          grep -q 'NEWSROOM_FIRST_PAINT_STABLE_START' index.html
      - name: Commit stable first paint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make Newsroom layout stable on first paint'
          git push
