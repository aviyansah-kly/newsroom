name: Newsroom Phase 3B Shared Tags Adapter
on:
  pull_request:
    paths:
      - 'scripts/components/tag-input-model.js'
      - 'scripts/components/tag-input-legacy-adapter.js'
      - 'tests/tag-input-legacy-adapter.test.cjs'
      - 'tests/tag-input-phase3b-integration.test.cjs'
      - 'scripts/newsroom-editorial-reusable.js'
      - '.github/workflows/newsroom-taginput-phase3b.yml'
  push:
    branches: [refactor/taginput-phase3b-legacy-tags]
jobs:
  adapter-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared model and isolated legacy adapter
        run: node --test tests/tag-input-legacy-adapter.test.cjs tests/tag-input-phase3b-integration.test.cjs
