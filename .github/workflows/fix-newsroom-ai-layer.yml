name: Fix Newsroom AI layer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-newsroom-ai-layer.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_newsroom_ai_layer.py
      - run: |
          grep -q 'NEWSROOM_AI_LAYER_FIX_START' index.html
          grep -q 'z-index:360' index.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Newsroom AI panel layering'
          git push
