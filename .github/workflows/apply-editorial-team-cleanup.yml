name: Apply editorial team cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-editorial-team-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python3 scripts/patch_editorial_team_cleanup.py
      - name: Verify
        run: |
          grep -q 'Tim Editorial' index.html
          grep -q 'NEWSROOM_EDITORIAL_TEAM_FINAL_CLEANUP_START' index.html
          grep -q 'NEWSROOM_EDITORIAL_TEAM_FINAL_CLEANUP_JS_START' index.html
          grep -q 'data-remove-team' index.html
          grep -q "roleNames=new Set" index.html
          grep -q "MutationObserver" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove duplicate editorial fields and unify chip remove actions'
          git push
