name: Apply adaptive editor header
on:
  push:
    paths:
      - '.github/workflows/apply-adaptive-editor-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply adaptive editor header patch
        run: python3 scripts/patch_adaptive_editor_header.py
      - name: Verify adaptive header markers
        run: |
          grep -q 'NEWSROOM_ADAPTIVE_EDITOR_HEADER_START' index.html
          grep -q "Gagal simpan" index.html
          grep -q '@media(max-width:900px)' index.html
          grep -q 'NEWSROOM_ADAPTIVE_EDITOR_HEADER_END' index.html
          grep -q '</body></html>' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply adaptive editor header'
          git push
