name: Dark Mode V2.2 Light Mode baseline protection
on:
  pull_request:
    paths:
      - styles/newsroom-theme-components.css
      - tests/dark-mode-expanded-editor-contract.cjs
      - .github/workflows/dark-mode-v22-light-regression.yml
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: original-main
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 pixelmatch@5 pngjs@7
      - run: npx playwright install chromium --with-deps
      - name: Compare Light Mode routes and pixels
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newsroom-candidate.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory original-main >/tmp/newsroom-baseline.log 2>&1 &
          sleep 3
          node tests/dark-mode-light-baseline.cjs
