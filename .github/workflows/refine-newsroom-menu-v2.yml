name: Refine Newsroom menu typography
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-newsroom-menu-v2.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set sidebar menu typography to 13px
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''/* NEWSROOM_MENU_FONT_14_START */\nbody.alt-editor-layout .cms-nav-head strong,\nbody.alt-editor-layout .cms-nav-head span,\nbody.alt-editor-layout .cms-nav-search input,\nbody.alt-editor-layout .cms-nav-cluster-head,\nbody.alt-editor-layout .cms-nav-cluster-head strong,\nbody.alt-editor-layout .cms-nav-item,\nbody.alt-editor-layout .cms-nav-item span,\nbody.alt-editor-layout .cms-nav-bottom .cms-nav-item,\nbody.alt-editor-layout .cms-nav-bottom .cms-nav-item span {\n  font-size:14px!important;\n}\n/* NEWSROOM_MENU_FONT_14_END */'''
          new='''/* NEWSROOM_MENU_FONT_13_START */\nbody.alt-editor-layout .cms-nav-head strong,\nbody.alt-editor-layout .cms-nav-head span,\nbody.alt-editor-layout .cms-nav-search input,\nbody.alt-editor-layout .cms-nav-cluster-head,\nbody.alt-editor-layout .cms-nav-cluster-head strong,\nbody.alt-editor-layout .cms-nav-item,\nbody.alt-editor-layout .cms-nav-item span,\nbody.alt-editor-layout .cms-nav-bottom .cms-nav-item,\nbody.alt-editor-layout .cms-nav-bottom .cms-nav-item span {\n  font-size:13px!important;\n}\n/* NEWSROOM_MENU_FONT_13_END */'''
          if old in s:
              s=s.replace(old,new,1)
          elif '/* NEWSROOM_MENU_FONT_13_START */' not in s:
              s=s.replace('</style></head>',new+'\n</style></head>',1)
          p.write_text(s)
          PY
          grep -q 'NEWSROOM_MENU_FONT_13_START' index.html
          grep -q 'font-size:13px!important' index.html
      - name: Commit refined Newsroom UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Set Newsroom sidebar menu typography to 13px'
          git push
