name: Remove empty figure field
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-empty-figure-field.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale Tokoh Figure field under Location
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='NEWSROOM_REMOVE_FIGURE_FIELD_START'
          if marker not in s:
              css='''\n/* NEWSROOM_REMOVE_FIGURE_FIELD_START */\nbody.alt-editor-layout .field:has(#altFigureInput){display:none!important}\n/* NEWSROOM_REMOVE_FIGURE_FIELD_END */\n'''
              if '</style></head>' not in s:
                  raise SystemExit('style closing marker not found')
              s=s.replace('</style></head>', css+'</style></head>', 1)
          p.write_text(s)
          PY
          grep -q 'NEWSROOM_REMOVE_FIGURE_FIELD_START' index.html
          grep -q '.field:has(#altFigureInput)' index.html
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove empty figure field under Location'
          git push
