name: Apply multi editorial people picker
on:
  push:
    paths:
      - '.github/workflows/apply-multi-editorial-people.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply people picker patch
        run: python3 scripts/patch_multi_editorial_people.py
      - name: Verify
        run: |
          grep -q 'NEWSROOM_MULTI_EDITORIAL_PEOPLE_START' index.html
          grep -q 'data-people-picker="reporter"' index.html
          grep -q 'data-people-picker="editor"' index.html
          grep -q 'Tambah reporter' index.html
          grep -q 'Tambah editor' index.html
          grep -q 'NEWSROOM_MULTI_EDITORIAL_PEOPLE_JS_END' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply multi-person editorial people picker'
          git push
