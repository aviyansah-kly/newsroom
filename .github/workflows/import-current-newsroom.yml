name: Import current Newsroom prototype
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-current-newsroom.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current Newsroom prototype
        run: |
          set -e
          curl -fL --retry 3 --connect-timeout 15 \
            'https://feat-sidebar-navigation-v65-cms-liputan6-alt3.avi-yansah.workers.dev/editor-alternative' \
            -o index.html
          grep -q 'Newsroom' index.html
          grep -q '<!doctype html>' index.html
      - name: Commit clean root prototype
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Import current Newsroom prototype'
          git push
