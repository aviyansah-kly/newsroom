name: Apply validation information hierarchy
on:
  push:
    paths:
      - '.github/workflows/apply-validation-information-hierarchy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validation information hierarchy patch
        run: python3 scripts/patch_validation_information_hierarchy.py
      - name: Verify validation hierarchy markers
        run: |
          grep -q 'NEWSROOM_VALIDATION_INFO_HIERARCHY_START' index.html
          grep -q 'temuan perlu ditinjau' index.html
          grep -q 'Tinjau di artikel' index.html
          grep -q 'Prioritas tinggi' index.html
          grep -q 'NEWSROOM_VALIDATION_INFO_HIERARCHY_END' index.html
          grep -q '</body></html>' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refine validation information hierarchy'
          git push
