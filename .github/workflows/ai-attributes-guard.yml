name: AI Attributes baseline guard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles/newsroom-ai-assist.css
      - design-system/foundations/tokens.css
      - scripts/check_ai_attributes_baseline.py
      - .github/workflows/ai-attributes-guard.yml
  pull_request:
    paths:
      - index.html
      - styles/newsroom-ai-assist.css
      - design-system/foundations/tokens.css
      - scripts/check_ai_attributes_baseline.py
      - .github/workflows/ai-attributes-guard.yml

jobs:
  protect-approved-ai-flow:
    name: Approved AI flow unchanged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch approved AI baseline
        run: git fetch origin baseline/ai-attributes-approved-2026-09-23:refs/remotes/origin/baseline/ai-attributes-approved-2026-09-23
      - name: Verify approved implementation and design tokens
        run: python3 scripts/check_ai_attributes_baseline.py
