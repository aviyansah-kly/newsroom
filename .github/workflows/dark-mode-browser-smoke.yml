name: Newsroom Dark Mode Browser Smoke
on:
  pull_request:
    paths:
      - 'styles/newsroom-dark-mode.css'
      - 'scripts/newsroom-appearance.js'
      - 'scripts/newsroom-shell.js'
      - 'tests/dark-mode-smoke.cjs'
      - 'tests/dark-mode-computed-audit.cjs'
      - '.github/workflows/dark-mode-browser-smoke.yml'
  workflow_dispatch:
jobs:
  visual-function-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run browser theme smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newsroom-theme-http.log 2>&1 &
          sleep 2
          node tests/dark-mode-smoke.cjs
          node tests/dark-mode-computed-audit.cjs
          node tests/editor-sidebar-smoke.cjs
          node tests/editor-link-dialog-smoke.cjs
