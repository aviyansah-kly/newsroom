name: Apply editor spacing refinement
on:
  push:
    paths:
      - '.github/workflows/apply-editor-spacing-refinement.yml'
      - 'scripts/patch_editor_spacing_refinement.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply editor spacing refinement
        run: python3 scripts/patch_editor_spacing_refinement.py
      - name: Verify editor spacing refinement
        run: |
          grep -q 'NEWSROOM_EDITOR_SPACING_REFINEMENT_START' index.html
          grep -q 'NEWSROOM_EDITOR_STICKY_BOOTSTRAP_START' index.html
          grep -q -- '--newsroom-editor-header-height:64px' index.html
          grep -q 'cms-nav-drawer' index.html
          grep -q 'height:calc(100vh - var(--newsroom-editor-header-height))!important' index.html
          grep -q 'padding:0!important' index.html
          grep -q 'top:calc(var(--newsroom-editor-header-height) - 1px)!important' index.html
          grep -q 'stickyReady' index.html
          grep -q 'margin-top:10px!important' index.html
          ! grep -q 'NEWSROOM_LEGACY_SIDEBAR_ALIGN_START' index.html
          ! grep -q 'NEWSROOM_EDITOR_SPACING_SYNC_START' index.html
          ! grep -q 'NEWSROOM_STICKY_EDITOR_HEADER_SYNC_START' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Align header shells and Text card toolbar'
          git push
