<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Liputan6 Newsroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--surface:#fff;--soft:#f8fafc;--hover:#f1f5f9;
  --text:#0f172a;--text2:#475569;--muted:#64748b;
  --border:#e2e8f0;--input:#cbd5e1;
  --orange:#f4511e;--orange2:#df4315;--orangeSoft:#fff3ed;
  --shadow:0 18px 50px rgba(15,23,42,.10);
  --focus:0 0 0 3px rgba(37,99,235,.12)
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 14% 12%,rgba(244,81,30,.07),transparent 30%),
    radial-gradient(circle at 86% 86%,rgba(37,99,235,.05),transparent 32%),
    var(--bg);
}
button,a{font:inherit}
.login-shell{
  min-height:100vh;display:grid;place-items:center;
}
.login-main{
  width:100%;display:grid;place-items:center;padding:32px 20px;
}
.login-card{
  width:min(440px,100%);padding:34px;border:1px solid var(--border);
  border-radius:16px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);
}
.login-logo{display:block;width:132px;height:auto;margin:0 auto 26px}
.login-card{text-align:center}
.login-card h1{margin:0;font-size:24px;line-height:32px;letter-spacing:-.02em}
.login-card p{margin:8px 0 0;font-size:14px;line-height:21px;color:var(--muted)}
.google-btn{
  width:100%;height:44px;margin-top:26px;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:0 14px;border:1px solid var(--input);border-radius:8px;
  background:#fff;color:var(--text);font-size:14px;font-weight:600;text-decoration:none;
  transition:.15s;
}
.google-btn:hover{background:var(--hover);border-color:#94a3b8}
.google-btn:focus-visible{outline:0;box-shadow:var(--focus)}
.google-icon{
  width:18px;height:18px;display:grid;place-items:center;flex:none;
}
.google-icon svg{display:block;width:18px;height:18px}
@media(max-width:640px){
  .login-logo{width:118px;margin-bottom:22px}
  .login-main{padding:20px 14px}
  .login-card{padding:26px 20px;border-radius:14px}
  .login-card h1{font-size:22px;line-height:29px}
}
</style>
</head>
<body>
<div class="login-shell">
  <main class="login-main">
    <section class="login-card" aria-labelledby="loginTitle">
      <img class="login-logo" src="assets/liputan6-logo.svg" alt="Liputan6">
      <h1 id="loginTitle">Login</h1>
      <p>Sign in with your work account to continue to Liputan6 Newsroom.</p>

      <a class="google-btn" href="dashboard.html" id="loginGoogle">
        <span class="google-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.702-1.567 2.684-3.876 2.684-6.615Z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.18l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
            <path fill="#FBBC05" d="M3.963 10.707A5.42 5.42 0 0 1 3.68 9c0-.592.102-1.166.283-1.707V4.961H.956A9 9 0 0 0 0 9c0 1.452.347 2.826.956 4.039l3.007-2.332Z"/>
            <path fill="#EA4335" d="M9 3.579c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.961l3.007 2.332C4.672 5.164 6.656 3.579 9 3.579Z"/>
          </svg>
        </span>
        <span>Login with Google</span>
      </a>

    </section>
  </main>
</div>
</body>
</html>
