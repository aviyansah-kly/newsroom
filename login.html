<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Liputan6 Newsroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--surface:#fff;--soft:#f8fafc;--hover:#f1f5f9;
  --text:#0f172a;--text2:#475569;--muted:#64748b;
  --border:#e2e8f0;--input:#cbd5e1;
  --orange:#f4511e;--orange2:#df4315;--orangeSoft:#fff3ed;
  --shadow:0 18px 50px rgba(15,23,42,.10);
  --focus:0 0 0 3px rgba(37,99,235,.12)
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 14% 12%,rgba(244,81,30,.07),transparent 30%),
    radial-gradient(circle at 86% 86%,rgba(37,99,235,.05),transparent 32%),
    var(--bg);
}
button,a{font:inherit}
.login-shell{
  min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;
}
.login-topbar{
  height:68px;display:flex;align-items:center;padding:0 24px;
  border-bottom:1px solid var(--border);background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
}
.brand-copy strong{display:block;font-size:14px;line-height:18px}
.login-main{
  display:grid;place-items:center;padding:48px 20px;
}
.login-card{
  width:min(440px,100%);padding:34px;border:1px solid var(--border);
  border-radius:16px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);
}
.login-logo{display:block;width:132px;height:auto;margin:0 auto 26px}
.login-card{text-align:center}
.login-card h1{margin:0;font-size:24px;line-height:32px;letter-spacing:-.02em}
.login-card p{margin:8px 0 0;font-size:14px;line-height:21px;color:var(--muted)}
.google-btn{
  width:100%;height:44px;margin-top:26px;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:0 14px;border:1px solid var(--input);border-radius:8px;
  background:#fff;color:var(--text);font-size:14px;font-weight:600;text-decoration:none;
  transition:.15s;
}
.google-btn:hover{background:var(--hover);border-color:#94a3b8}
.google-btn:focus-visible{outline:0;box-shadow:var(--focus)}
.google-icon{
  width:18px;height:18px;display:grid;place-items:center;flex:none;
  font-size:15px;font-weight:700;color:#4285f4;
}
.login-helper{
  margin-top:14px;text-align:center;font-size:11px;line-height:17px;color:#94a3b8;
}
.login-footer{
  min-height:54px;display:flex;align-items:center;justify-content:center;
  padding:12px 20px;color:#94a3b8;font-size:11px;
}
@media(max-width:640px){
  .login-topbar{height:60px;padding:0 16px}
  .brand-copy{display:block}
  .login-logo{width:118px;margin-bottom:22px}
  .login-main{padding:28px 14px}
  .login-card{padding:26px 20px;border-radius:14px}
  .login-card h1{font-size:22px;line-height:29px}
}
</style>
</head>
<body>
<div class="login-shell">
  <header class="login-topbar">
    <span class="brand-copy"><strong>Newsroom</strong></span>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="loginTitle">
      <img class="login-logo" src="assets/liputan6-logo.svg" alt="Liputan6">
      <h1 id="loginTitle">Masuk ke Newsroom</h1>
      <p>Gunakan akun kerja Anda untuk melanjutkan.</p>

      <a class="google-btn" href="dashboard.html" id="loginGoogle">
        <span class="google-icon" aria-hidden="true">G</span>
        <span>Login with Google</span>
      </a>

      <div class="login-helper">Akses internal Liputan6 Newsroom</div>
    </section>
  </main>

  <footer class="login-footer">Liputan6 Newsroom</footer>
</div>
</body>
</html>
